[workspace]
resolver = "2"
members = ["app/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
neu-index = { path = "crates/neu-index" }
neu-router = { path = "crates/neu-router" }
neu-provider = { path = "crates/neu-provider" }
neu-agent = { path = "crates/neu-agent" }
neu-tools = { path = "crates/neu-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
